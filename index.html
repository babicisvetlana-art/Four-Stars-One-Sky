<script>
(function(){

  const meteor=document.getElementById('meteor');
  function shoot(){
    meteor.classList.remove('fly'); void meteor.offsetWidth; meteor.classList.add('fly');
    setTimeout(shoot,11000+Math.random()*7000);
  }
  setTimeout(shoot,8500);

  document.querySelectorAll('a.p').forEach(card=>{
    card.addEventListener('click',function(e){
      e.preventDefault();
      const url=this.href;
      const btn=this.querySelector('.go');
      btn.classList.add('launch');
      setTimeout(()=>{ window.open(url,'_blank','noopener'); btn.classList.remove('launch'); },420);
    });
  });
})();
</script>
